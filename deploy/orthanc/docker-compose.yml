# Orthanc PACS (server 10.4.0.10) — dikelola via docker compose.
# Dipasang di server sebagai /home/pacs/orthanc/docker-compose.yml (20 Nov 2026),
# menggantikan container `orthanc` + `orthanc-proxy` yang sebelumnya `docker run`.
# Data study tetap di volume `orthanc-storage` (external, tidak dihapus compose).
#
# Deploy/perbarui:
#   cd /home/pacs/orthanc && sudo docker compose up -d
# Cek status:
#   sudo docker compose ps        # orthanc harus "(healthy)"
name: orthanc

services:
  orthanc:
    # Digest dipin ke image yang sedang berjalan (Orthanc 1.12.11). Jangan diganti
    # `latest` supaya `up -d` tidak meng-upgrade Orthanc tanpa disengaja.
    image: orthancteam/orthanc@sha256:fdb2bd7c80fab08578b5d3080f125eb9336994781a6e5f512fb962dca1414c30
    container_name: orthanc
    restart: unless-stopped
    # Plugin MWL contoh bawaan image dimatikan agar tidak bentrok dengan
    # libOrthancWorklists.so. Dulu dijalankan manual (`docker exec mv`) dan hilang
    # setiap container di-recreate.
    entrypoint:
      - /bin/bash
      - -c
      - |
        mv -f /usr/share/orthanc/plugins/libModalityWorklists.so \
              /usr/share/orthanc/plugins/libModalityWorklists.so.disabled 2>/dev/null || true
        exec /docker-entrypoint.sh /tmp/orthanc.json
    ports:
      - "4242:4242"   # DICOM SCP (AET ORTHANC)
      - "8042:8042"   # REST / DICOMweb
    # Kredensial SIMRS tidak disimpan di repo: isi /home/pacs/orthanc/.env (chmod 600)
    #   SIMRS_AUTH_USER=... / SIMRS_AUTH_PASS=...
    environment:
      TZ: Asia/Jakarta
      MALLOC_ARENA_MAX: "5"
      PYTHON_PLUGIN_ENABLED: "true"
      # Tombol "Viewer" di dashboard membuka /stone-webviewer/index.html.
      # Tanpa env ini plugin tidak dimuat → Orthanc balas 404 "Unknown resource".
      # Binary-nya sudah ada di /usr/share/orthanc/plugins-available/ dan baru
      # di-link ke plugins/ oleh entrypoint bila env ini true.
      # Butuh plugin DICOMweb (aktif default di image orthancteam/orthanc).
      STONE_WEB_VIEWER_PLUGIN_ENABLED: "true"
      SIMRS_WORKLIST_URL: ${SIMRS_WORKLIST_URL:-http://10.4.0.22/simrs/index.php/radiologi/api_worklist_dx/mwl_today}
      SIMRS_AUTH_USER: ${SIMRS_AUTH_USER:-}
      SIMRS_AUTH_PASS: ${SIMRS_AUTH_PASS:-}
    volumes:
      - /etc/orthanc:/etc/orthanc                     # konfigurasi permanen (orthanc.json, worklists.json, lua)
      - orthanc-storage:/var/lib/orthanc/db           # database + storage study
      - orthanc-worklists:/var/lib/orthanc/worklists  # DB plugin orthanc-worklists
    healthcheck:
      # image orthancteam/orthanc tidak menyertakan curl/wget; python3 tersedia
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8042/system', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  orthanc-proxy:
    image: nginx:alpine
    container_name: orthanc-proxy
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - /opt/orthanc-proxy/.htpasswd:/etc/nginx/.htpasswd:ro
      - /opt/orthanc-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - orthanc

volumes:
  orthanc-storage:
    name: orthanc-storage
    external: true
  orthanc-worklists:
    name: orthanc-worklists
